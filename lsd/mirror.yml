# ⚠ `extends:` is a SHALLOW merge of TOP-LEVEL KEYS. Setting a key here
# REPLACES the base's block outright — there is no per-key merge. `platforms:`
# is deliberately NOT restated below: it carries the container legs that make
# this spec's bare Linux keys honest, and restating it to tweak one runner
# would drop them all without reddening anything.
extends: ../mirror-base.yml

name: lsd

# Logical index package `lsd-rs/lsd` at the physical path
# `ghcr.io/ocx-contrib/lsd-rs/lsd` — slash segments, never hyphen-flattened.
# Two segments always. `lsd-rs` is the project's own GitHub org (rule 2:
# the org IS the project brand), and the package segment is the name the
# project publishes under — the crate, the binary and the repo are all `lsd`,
# so the namespace carries the `-rs` suffix and the package does not. The
# first path segment of `target.repository` must be this repo's own GitHub
# owner: GITHUB_TOKEN only authorises packages owned by the repo the workflow
# runs in.
target:
  registry: ghcr.io
  repository: ocx-contrib/lsd-rs/lsd

source:
  type: github_release
  owner: lsd-rs
  repo: lsd
  # lsd TAGS carry a `v` prefix from v1.0.0 on (`v1.2.0`), and so do the ASSET
  # FILENAMES (`lsd-v1.2.0-…`) — unusual, but consistent across the whole
  # in-range set. The capture group strips the tag's `v` so the published
  # version is bare semver. Releases before v1.0.0 used bare tags (`0.23.1`);
  # they are far below the floor and this pattern does not match them.
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# lsd is Rust and upstream ships BOTH `-gnu` and `-musl` for amd64 and arm64.
# The triple is not the verdict; the ELF header is. Measured on v1.2.0 (latest)
# and v1.1.3 (the floor), on both arches:
#
#   $ file lsd-v1.2.0-x86_64-unknown-linux-musl/lsd
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#   $ file lsd-v1.2.0-aarch64-unknown-linux-musl/lsd
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, stripped
#   $ file lsd-v1.1.3-x86_64-unknown-linux-musl/lsd
#   ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#   $ file lsd-v1.1.3-aarch64-unknown-linux-musl/lsd
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, stripped
#   $ readelf -l <bin> | grep -c INTERP   → 0        (all four)
#   $ readelf -d <bin> | grep NEEDED      → (none)   (all four)
#
# No PT_INTERP and no DT_NEEDED: musl is linked IN, not linked AGAINST. The
# artifact requires nothing of the host, so both Linux keys are BARE — no
# `+libc.*` suffix. Tagging them `+libc.musl` would be a false requirement that
# hid the package from every glibc host it in fact runs on.
#
# The gnu assets were measured too, and are the contrast that makes the choice
# deliberate rather than incidental:
#
#   $ file lsd-v1.2.0-x86_64-unknown-linux-gnu/lsd
#   … dynamically linked, interpreter /lib64/ld-linux-x86-64.so.2, for
#   GNU/Linux 2.6.32, stripped
#   $ readelf -d … | grep NEEDED  → libgcc_s.so.1, librt.so.1,
#                                   libpthread.so.0, libc.so.6
#   $ file lsd-v1.2.0-aarch64-unknown-linux-gnu/lsd
#   … dynamically linked, interpreter /lib/ld-linux-aarch64.so.1, …
#
# Those genuinely require glibc and would need `+libc.glibc`. Not carried: the
# static musl build already runs under BOTH userlands, and lsd touches only the
# local filesystem — it makes no network or NSS calls, so the usual reason to
# ship a second gnu key (musl's resolver ignores nsswitch.conf) does not apply
# here. One bare key per arch, and the alpine container leg in
# ../mirror-base.yml is what turns the universality claim into evidence.
#
# ─── Scope (verified on ALL THREE in-range releases: v1.1.3, v1.1.5, v1.2.0) ─
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   i686-unknown-linux-{gnu,musl}    — no OCX linux/i686 platform
#   arm-unknown-linux-gnueabihf      — no OCX linux/arm platform (gnueabihf
#                                      only; unlike the other linux arches
#                                      upstream ships no musl armv7 build)
#   loongarch64-unknown-linux-gnu    — no OCX platform, AND a broken upload:
#                                      the asset carries NO file extension at
#                                      all (present at v1.1.3 and v1.1.5, gone
#                                      by v1.2.0). Every pattern below ends
#                                      `\.tar\.gz$` or `\.zip$`, so it cannot
#                                      match.
#   i686-pc-windows-msvc.zip         — no OCX windows/i686 platform
#   *-pc-windows-gnu.zip             — NEW at v1.2.0, absent at the v1.1.3
#                                      floor. Carrying it would resolve zero
#                                      assets on two of the three in-range
#                                      releases — silently skipped, not an
#                                      error. The msvc variant spans the whole
#                                      range, so msvc is what is declared, and
#                                      the patterns end `-msvc\.zip$` so the
#                                      gnu sibling can never match one.
#   lsd_<V>_*.deb, lsd-musl_<V>_*.deb — distro packaging, not a portable
#                                      archive. Their names start `lsd_` /
#                                      `lsd-musl_` (underscore) rather than
#                                      `lsd-v`, so the anchored patterns below
#                                      exclude them twice over.
#
# There is NO windows/arm64 platform in this mirror and none staged for later:
# upstream has never shipped an aarch64 Windows asset. Windows is x86_64 and
# i686 only, and i686 has no OCX platform key — so five OCX platforms, not six.
#
# The anchored ^…$ regexes are what keep all of the above out. Resolution
# verified BOTH ways on every in-range release: each pattern matches EXACTLY
# one asset, and no other asset in any release matches any of them. A pattern
# matching zero is silently skipped, not an error — it would yield a green run
# with a missing platform.
#
# ⚠ STAGED ROLLOUT — darwin/windows keys are commented here AND in
# ../mirror-base.yml's `platforms:` block; both halves get uncommented together,
# one pass at a time, with `generate ci` re-run each pass.
assets:
  linux/amd64:
    - "^lsd-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
  linux/arm64:
    - "^lsd-v.*-aarch64-unknown-linux-musl\\.tar\\.gz$"
  # darwin/amd64:
  #   - "^lsd-v.*-x86_64-apple-darwin\\.tar\\.gz$"
  # darwin/arm64:
  #   - "^lsd-v.*-aarch64-apple-darwin\\.tar\\.gz$"
  # windows/amd64:
  #   - "^lsd-v.*-x86_64-pc-windows-msvc\\.zip$"

# Every archive — tarball and zip alike — wraps its payload in ONE directory
# named after the asset itself (`lsd-v1.2.0-x86_64-unknown-linux-musl/`), which
# holds `lsd` (`lsd.exe` on Windows) at its top plus LICENSE, README.md, the
# `lsd.1` man page and an `autocomplete/` dir. There is no `bin/` subdirectory.
# Verified with `tar tvf` / `unzip -l` on v1.1.3 and v1.2.0, linux + darwin +
# windows — the layout is identical everywhere.
#
# strip_components 1 is therefore FORCED, not chosen: the wrapper directory's
# name embeds both the version and the target triple, so it differs per
# platform and per release and cannot be named in a static PATH. Stripping it
# lands `lsd` at the content root and one metadata.json (PATH = ${installPath})
# serves every platform.
asset_type:
  type: archive
  strip_components: 1

# `off`, overriding the base's `auto` — FORCED by the layout above, not chosen.
# The scan only inspects an interface-visible `${installPath}/<dir>` PATH
# entry, and once the wrapper directory is stripped this archive has no
# subdirectory to point one at, so both `auto` and `verify` fail spec load at
# exit 65:
#
#   bin_scan is enabled but metadata.json declares no interface-visible
#   ${installPath}/<dir> PATH entry — the verification would inspect no file and
#   pass green whatever the archive contains.
#
# The `binaries` list in metadata.json is therefore hand-maintained, exactly as
# that error directs. It is short and stable: `lsd` (`lsd.exe` on Windows) is
# the ONLY mode-0755 entry in the archive — LICENSE, README.md, lsd.1 and every
# file under autocomplete/ are 0644 data. Quoted so no YAML 1.1 reader folds
# the bare word into boolean `false`.
bin_scan: "off"

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  min: "1.1.3"
  new_per_run: 5
  poll_interval: "14 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: lsd/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/lsd-rs/lsd/license --jq '.license.spdx_id'
  #   Apache-2.0
  org.opencontainers.image.licenses: "Apache-2.0"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: lsd-rs/lsd
  fork: ocx-contrib/index
